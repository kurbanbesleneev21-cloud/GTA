name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Download Xray core (libv2ray.aar)
        run: |
          mkdir -p app/libs
          gh release download -R 2dust/AndroidLibXrayLite --pattern 'libv2ray.aar' -D app/libs --clobber
          ls -la app/libs

      - name: Download geo files
        run: |
          mkdir -p app/src/main/assets
          gh release download -R runetfreedom/russia-v2ray-rules-dat --pattern 'geoip.dat' --pattern 'geosite.dat' -D app/src/main/assets --clobber
          ls -la app/src/main/assets

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/nectar.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using signing key from repository secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"; ALIAS="${KEY_ALIAS:-nectar}"
          else
            echo "::warning::No KEYSTORE_BASE64 secret - generating a temporary signing key (updates will need reinstall)"
            PASS="$(openssl rand -hex 16)"; ALIAS=nectar
            keytool -genkeypair -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Nectar VPN, O=Nectar, C=RU"
          fi
          echo "::add-mask::$PASS"
          {
            echo "NECTAR_KEYSTORE=$KS"
            echo "NECTAR_KEYSTORE_PASSWORD=$PASS"
            echo "NECTAR_KEY_PASSWORD=$PASS"
            echo "NECTAR_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: NectarVPN-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nectar VPN 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Скачайте **NectarVPN_..._arm64-v8a.apk** — подходит для почти всех современных телефонов.
            Если не устанавливается — берите **universal**.
          files: out/*.apk
